server:
  port: 8082

file:
  upload-dir: ${UPLOAD_DIR:/app/uploads}

spring:
  datasource:
    url: jdbc:postgresql://db:5432/stock_market
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
